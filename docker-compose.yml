services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb_graphcortex
    ports:
      - "6379:6379"   # Redis/FalkorDB protocol
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - ./data/falkordb:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  graphcortex:
    build: .
    container_name: graphcortex_swarm
    tty: true
    stdin_open: true
    depends_on:
      falkordb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH=graphcortex
      - EMBEDDING_DEVICE=cpu # Change to 'cuda' if using NVIDIA GPU on Win/Linux
      - HF_HOME=/app/data/huggingface
      - PYTHONPATH=/app/src
    # Uncomment the section below to enable NVIDIA GPU support (Linux/Windows only)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - .:/app
      - ./Logs:/app/Logs
      - ./data:/app/data
