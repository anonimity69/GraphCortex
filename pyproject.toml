[project]
name = "graphcortex"
version = "0.2.2"
description = "A self-healing knowledge graph memory layer for AI agents powered by Reinforcement Learning."
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Shrayanendra Nath Mandal", email = "shrayanendranathmandal@example.com"},
]
dependencies = [
    "falkordb>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "gymnasium>=0.29.0",
    "datasets>=2.16.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.2",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.30",
    "pytest>=7.0.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/anonimity69/GraphCortex"
Repository = "https://github.com/anonimity69/GraphCortex.git"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
graphcortex = "graph_cortex.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
