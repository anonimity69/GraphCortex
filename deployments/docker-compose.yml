services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb_graphcortex
    ports:
      - "6379:6379"   # Redis/FalkorDB protocol
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - ./data/falkordb:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
